<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="GitHub Desktop 主界面示意图">
  <defs>
    <linearGradient id="bg8gd" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6"/>
      <stop offset="100%" stop-color="#E8E1D3"/>
    </linearGradient>
    <linearGradient id="tb8gd" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#EFE9DE"/>
      <stop offset="100%" stop-color="#D9D1C0"/>
    </linearGradient>
    <radialGradient id="r8gd" cx="0.4" cy="0.35" r="0.7"><stop offset="0%" stop-color="#FF7B72"/><stop offset="60%" stop-color="#FC615D"/><stop offset="100%" stop-color="#D9443F"/></radialGradient>
    <radialGradient id="y8gd" cx="0.4" cy="0.35" r="0.7"><stop offset="0%" stop-color="#FFCF6A"/><stop offset="60%" stop-color="#FDBC40"/><stop offset="100%" stop-color="#D89826"/></radialGradient>
    <radialGradient id="g8gd" cx="0.4" cy="0.35" r="0.7"><stop offset="0%" stop-color="#4FD75F"/><stop offset="60%" stop-color="#34C748"/><stop offset="100%" stop-color="#1F9A2A"/></radialGradient>
    <filter id="ws8gd" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1F2230" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg8gd)"/>

  <g filter="url(#ws8gd)">
    <!-- 窗口 -->
    <rect x="50" y="40" width="700" height="320" rx="11" fill="#FFFFFF" stroke="#C9C0AF" stroke-width="0.5"/>

    <!-- 标题栏 -->
    <path d="M50 51 Q50 40 61 40 L739 40 Q750 40 750 51 L750 70 L50 70 Z" fill="url(#tb8gd)"/>
    <circle cx="75" cy="55" r="6.5" fill="url(#r8gd)"/>
    <circle cx="96" cy="55" r="6.5" fill="url(#y8gd)"/>
    <circle cx="117" cy="55" r="6.5" fill="url(#g8gd)"/>
    <text x="400" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#5F5751" text-anchor="middle">GitHub Desktop</text>

    <!-- App 工具栏(深色) -->
    <rect x="50" y="70" width="700" height="40" fill="#24292E"/>

    <!-- Current Repository 区 -->
    <rect x="64" y="80" width="170" height="22" rx="3" fill="#33393F"/>
    <text x="76" y="89" font-family="system-ui, sans-serif" font-size="9" fill="#8E97A0">CURRENT REPOSITORY</text>
    <text x="76" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">my-product-site</text>

    <!-- Current Branch 区 -->
    <rect x="244" y="80" width="170" height="22" rx="3" fill="#33393F"/>
    <text x="256" y="89" font-family="system-ui, sans-serif" font-size="9" fill="#8E97A0">CURRENT BRANCH</text>
    <text x="256" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">main</text>

    <!-- Publish repository 按钮(主 CTA,蓝色,有箭头指示) -->
    <rect x="600" y="80" width="138" height="22" rx="3" fill="#2EA043" stroke="#246C2E" stroke-width="0.5"/>
    <text x="616" y="95" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF">↑ Publish repository</text>

    <!-- 箭头指向 Publish 按钮 -->
    <path d="M730 122 L726 108" stroke="#E8704A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <polygon points="724,108 730,108 728,114" fill="#E8704A"/>
    <text x="710" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E8704A" text-anchor="end">先点这里</text>

    <!-- 左侧 sidebar -->
    <rect x="50" y="110" width="220" height="250" fill="#F6F8FA"/>
    <line x1="270" y1="110" x2="270" y2="360" stroke="#E1E4E8" stroke-width="0.5"/>

    <!-- 左 sidebar tabs -->
    <rect x="64" y="124" width="192" height="32" rx="4" fill="#FFFFFF" stroke="#D1D5DA" stroke-width="0.5"/>
    <text x="80" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F2230">Changes</text>
    <rect x="220" y="132" width="22" height="16" rx="9" fill="#E1E4E8"/>
    <text x="231" y="143" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#586069" text-anchor="middle">0</text>

    <!-- History tab(高亮的) -->
    <rect x="64" y="160" width="192" height="32" rx="4" fill="#0366D6"/>
    <text x="80" y="181" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">History</text>
    <rect x="220" y="168" width="22" height="16" rx="9" fill="#0E5BB5"/>
    <text x="231" y="179" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>

    <!-- No local changes 提示 -->
    <text x="160" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#8B8F9C" text-anchor="middle">尚未推送到远程</text>
    <text x="160" y="238" font-family="system-ui, sans-serif" font-size="10" fill="#8B8F9C" text-anchor="middle">点右上 Publish</text>

    <!-- 右侧主区域:commit 历史 -->
    <text x="290" y="135" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8B8F9C" letter-spacing="1">提交历史</text>

    <!-- Commit 卡片 -->
    <rect x="290" y="148" width="446" height="68" rx="5" fill="#FFFFFF" stroke="#0366D6" stroke-width="1.4"/>
    <!-- 头像占位 -->
    <circle cx="310" cy="174" r="11" fill="#3E4ECC"/>
    <text x="310" y="178" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">W</text>
    <!-- commit 信息 -->
    <text x="332" y="170" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F2230">叫醒猫官网第一版</text>
    <text x="332" y="186" font-family="system-ui, sans-serif" font-size="10.5" fill="#8B8F9C">wuxiaodong · 2 分钟前 · 提交了 1 个文件</text>
    <!-- commit hash -->
    <rect x="666" y="160" width="60" height="20" rx="3" fill="#F4F1EA"/>
    <text x="696" y="174" font-family="Menlo, monospace" font-size="10.5" font-weight="600" fill="#5F5751" text-anchor="middle">a3f2c1d</text>
    <!-- 文件变更条 -->
    <rect x="332" y="196" width="80" height="6" rx="3" fill="#E6F4ED"/>
    <rect x="332" y="196" width="54" height="6" rx="3" fill="#2F9E6E"/>
    <text x="420" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#8B8F9C">+86 行</text>

    <!-- 第二条占位 commit -->
    <rect x="290" y="226" width="446" height="50" rx="5" fill="#FAF8F4" stroke="#E1E4E8" stroke-width="0.5"/>
    <circle cx="310" cy="251" r="11" fill="#D9D1C0"/>
    <text x="332" y="248" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#8B8F9C">initial commit</text>
    <text x="332" y="263" font-family="system-ui, sans-serif" font-size="10.5" fill="#A09A8C">wuxiaodong · 30 分钟前</text>
    <rect x="666" y="237" width="60" height="20" rx="3" fill="#F4F1EA"/>
    <text x="696" y="251" font-family="Menlo, monospace" font-size="10.5" font-weight="600" fill="#5F5751" text-anchor="middle">e8b0a55</text>

    <!-- 底部状态栏 -->
    <rect x="50" y="338" width="700" height="22" fill="#F6F8FA"/>
    <line x1="50" y1="338" x2="750" y2="338" stroke="#E1E4E8" stroke-width="0.5"/>
    <text x="64" y="353" font-family="system-ui, sans-serif" font-size="10.5" fill="#586069">my-product-site · main · 已 commit 但未推送</text>
  </g>
</svg>
