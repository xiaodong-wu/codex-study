<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Chat、ChatGPT Work 和 Codex 三种入口示意图</title>
  <desc id="desc">用三个并列区域说明 Chat 适合快速问答，Work 适合交付成品，Codex 适合处理代码和本地项目。</desc>
  <rect width="960" height="540" rx="28" fill="#faf8f4"/>
  <text x="64" y="72" font-family="PingFang SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2230">同一个桌面端，三种不同工作方式</text>
  <text x="64" y="104" font-family="PingFang SC, Arial, sans-serif" font-size="15" fill="#737887">先看你要的是一句回答、一份成品，还是直接处理项目文件</text>

  <rect x="64" y="144" width="252" height="292" rx="18" fill="#ffffff" stroke="#e8e4dc"/>
  <circle cx="100" cy="184" r="16" fill="#ff805c"/>
  <text x="128" y="192" font-family="PingFang SC, Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2230">Chat</text>
  <text x="88" y="238" font-family="PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a4e5c">快速问、快速答</text>
  <text x="88" y="276" font-family="PingFang SC, Arial, sans-serif" font-size="14" fill="#737887">解释概念 · 头脑风暴</text>
  <text x="88" y="306" font-family="PingFang SC, Arial, sans-serif" font-size="14" fill="#737887">短改写 · 临时建议</text>
  <rect x="88" y="350" width="204" height="52" rx="10" fill="#fff3ee"/>
  <text x="104" y="381" font-family="PingFang SC, Arial, sans-serif" font-size="14" fill="#9a442c">“这个报错是什么意思？”</text>

  <rect x="354" y="144" width="252" height="292" rx="18" fill="#f0f2ff" stroke="#cfd3ee"/>
  <circle cx="390" cy="184" r="16" fill="#4858dc"/>
  <text x="418" y="192" font-family="PingFang SC, Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2230">Work</text>
  <text x="378" y="238" font-family="PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#303b9e">把事情做成成品</text>
  <text x="378" y="276" font-family="PingFang SC, Arial, sans-serif" font-size="14" fill="#4a4e5c">文档 · 表格 · 演示稿</text>
  <text x="378" y="306" font-family="PingFang SC, Arial, sans-serif" font-size="14" fill="#4a4e5c">研究 · 插件 · 长任务</text>
  <rect x="378" y="350" width="204" height="52" rx="10" fill="#ffffff"/>
  <text x="394" y="381" font-family="PingFang SC, Arial, sans-serif" font-size="14" fill="#303b9e">“整理并交付一份方案”</text>

  <rect x="644" y="144" width="252" height="292" rx="18" fill="#202330" stroke="#202330"/>
  <circle cx="680" cy="184" r="16" fill="#69c995"/>
  <text x="708" y="192" font-family="PingFang SC, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Codex</text>
  <text x="668" y="238" font-family="PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">直接处理项目</text>
  <text x="668" y="276" font-family="PingFang SC, Arial, sans-serif" font-size="14" fill="#cfd3df">读写代码 · 跑命令</text>
  <text x="668" y="306" font-family="PingFang SC, Arial, sans-serif" font-size="14" fill="#cfd3df">测试 · Diff · Worktree</text>
  <rect x="668" y="350" width="204" height="52" rx="10" fill="#2f3343"/>
  <text x="684" y="381" font-family="PingFang SC, Arial, sans-serif" font-size="14" fill="#9ee3bd">“修好项目并跑完测试”</text>

  <path d="M316 290h30" stroke="#c7cbd6" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M606 290h30" stroke="#c7cbd6" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="64" y="482" font-family="PingFang SC, Arial, sans-serif" font-size="15" fill="#737887">拿不准时：先说清最终要交付什么，再让 ChatGPT 帮你选入口。</text>
</svg>
